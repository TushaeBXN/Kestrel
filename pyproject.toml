[project]
name = "kestrel"
version = "0.2.0"
description = "A model-agnostic, browser-driven coding agent with GitHub clone/commit/push"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openai>=1.30",
  "httpx>=0.27",
]

[project.scripts]
kestrel = "kestrel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.setuptools.package-data]
kestrel = ["web/*.html"]
